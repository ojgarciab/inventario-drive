<mat-card appearance="outlined">
  <mat-card-header>
    <mat-card-title>Sesión iniciada</mat-card-title>
    @if (user(); as u) {
      <mat-card-subtitle data-testid="cuenta">{{ u.name }} · {{ u.email }}</mat-card-subtitle>
    }
  </mat-card-header>
  <mat-card-content>
    <p>
      La aplicación ya tiene acceso a su espacio privado en Google Drive. El inventario de
      contenedores y objetos llegará en las siguientes fases.
    </p>
  </mat-card-content>
</mat-card>
